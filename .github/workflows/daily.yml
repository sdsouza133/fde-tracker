name: Daily outreach list

on:
  schedule:
    - cron: "0 11 * * *"   # 07:00 Eastern (06:00 in winter)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-outreach
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The output holds people's names and emails: never commit it to a public repo.
      - name: Refuse to run in a public repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::error::This repo is public. Make it private (Settings → General → Danger Zone) before the tracker writes contact data."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's list
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: python scripts/daily.py --date "$(TZ=America/Toronto date +%F)"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state TRACKER.md
          git diff --cached --quiet && exit 0
          git commit -m "Outreach list for $(TZ=America/Toronto date +%F)"
          git push
